services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    container_name: spacetodo-db
    environment:
      POSTGRES_USER: spacetodo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-spacetodo}
      POSTGRES_DB: spacetodo
    volumes:
      - ./db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spacetodo"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    container_name: spacetodo-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://spacetodo:${POSTGRES_PASSWORD:-spacetodo}@db:5432/spacetodo
      SESSION_SECRET: ${SESSION_SECRET}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      FRONTEND_URL: ${FRONTEND_URL}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI}
      OIDC_SCOPES: ${OIDC_SCOPES:-openid profile email}
      PORT: 4000

  frontend:
    build: ./frontend
    restart: unless-stopped
    container_name: spacetodo-frontend
    depends_on:
      - backend
    ports:
      - "${HTTP_PORT:-8080}:80"